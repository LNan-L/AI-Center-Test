<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>星空战舰 · 动态演示</title>
<style>
  :root{
    --cyan:#6ff0ff;
    --amber:#ffc46b;
    --danger:#ff5f7a;
    --dim:rgba(140,200,230,.55);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#01030a;overflow:hidden}
  body{
    font-family:"SF Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;
    color:#cfefff;
    -webkit-user-select:none;user-select:none;
    cursor:crosshair;
  }
  #stage{position:fixed;inset:0;display:block}

  /* ---------- HUD ---------- */
  .hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  .corner{
    position:absolute;width:64px;height:64px;
    border:1px solid rgba(111,240,255,.35);
    filter:drop-shadow(0 0 6px rgba(111,240,255,.35));
  }
  .corner.tl{top:18px;left:18px;border-right:0;border-bottom:0}
  .corner.tr{top:18px;right:18px;border-left:0;border-bottom:0}
  .corner.bl{bottom:18px;left:18px;border-right:0;border-top:0}
  .corner.br{bottom:18px;right:18px;border-left:0;border-top:0}

  .panel{position:absolute;font-size:11px;letter-spacing:.16em;line-height:1.85;text-transform:uppercase}
  .panel.p-tl{top:34px;left:44px}
  .panel.p-tr{top:34px;right:44px;text-align:right}
  .panel.p-bl{bottom:36px;left:44px}
  .panel.p-br{bottom:36px;right:44px;text-align:right}

  .k{color:var(--dim)}
  .v{color:var(--cyan);text-shadow:0 0 10px rgba(111,240,255,.55)}
  .v.warn{color:var(--danger);text-shadow:0 0 10px rgba(255,95,122,.6)}
  .v.amber{color:var(--amber);text-shadow:0 0 10px rgba(255,196,107,.55)}

  .title{
    position:absolute;top:50%;left:0;right:0;text-align:center;
    font-size:12px;letter-spacing:.5em;color:rgba(160,220,255,.28);
    transform:translateY(-240px)
  }

  .bars{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .bar{width:190px;height:5px;background:rgba(111,240,255,.10);position:relative;overflow:hidden}
  .bar i{position:absolute;inset:0;transform-origin:left center;background:linear-gradient(90deg,#39d2ff,#9ff8ff);
        box-shadow:0 0 12px rgba(111,240,255,.7)}
  .bar.b2 i{background:linear-gradient(90deg,#ffb64d,#ffe7b0);box-shadow:0 0 12px rgba(255,196,107,.7)}
  .bar.b3 i{background:linear-gradient(90deg,#ff4f6d,#ffa8b8);box-shadow:0 0 12px rgba(255,95,122,.7)}

  .scanlines{
    position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.9) 0 1px,transparent 1px 3px);
  }
  .vignette{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 55%,transparent 42%,rgba(0,2,8,.72) 100%);
  }

  /* ---------- 控制台 ---------- */
  #dock{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    display:flex;gap:8px;z-index:10;flex-wrap:wrap;justify-content:center;
    padding:0 12px;
  }
  #dock button{
    pointer-events:auto;
    font:inherit;font-size:11px;letter-spacing:.12em;
    color:#bdf0ff;background:rgba(10,32,50,.55);
    border:1px solid rgba(111,240,255,.32);
    padding:9px 14px;border-radius:2px;cursor:pointer;
    backdrop-filter:blur(6px);
    transition:.18s ease;
    text-transform:uppercase;
  }
  #dock button:hover{background:rgba(20,70,105,.7);border-color:var(--cyan);box-shadow:0 0 18px rgba(111,240,255,.35);color:#fff}
  #dock button:active{transform:translateY(1px)}
  #dock button.on{background:rgba(255,95,122,.22);border-color:var(--danger);color:#ffd7de;box-shadow:0 0 18px rgba(255,95,122,.35)}

  #hint{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:20;text-align:center;font-size:12px;letter-spacing:.22em;line-height:2.4;
    color:rgba(190,235,255,.75);text-shadow:0 0 20px rgba(111,240,255,.5);
    transition:opacity .7s ease;pointer-events:none;
  }
  #hint b{color:#fff;font-weight:600}
  #hint .sub{font-size:10.5px;color:rgba(140,200,230,.6);letter-spacing:.16em}
  @media (max-width:760px){
    .panel{font-size:9.5px;letter-spacing:.1em}
    .bar{width:120px}
    .title{display:none}
    .panel.p-br{display:none}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="hud">
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <div class="title">STELLAR  DREADNOUGHT  //  CLASS-VII  BATTLESHIP</div>

  <div class="panel p-tl">
    <div><span class="k">vessel</span> <span class="v">DSV-07 天穹级</span></div>
    <div><span class="k">sector</span> <span class="v" id="uiSector">NGC-4471 · 猎户臂</span></div>
    <div><span class="k">drift</span> <span class="v amber" id="uiWarp">1.0c</span></div>
  </div>

  <div class="panel p-tr">
    <div><span class="k">shield</span> <span class="v" id="uiShield">100%</span></div>
    <div><span class="k">hull</span> <span class="v" id="uiHull">100%</span></div>
    <div><span class="k">hostiles</span> <span class="v warn" id="uiHostile">0</span></div>
  </div>

  <div class="panel p-bl">
    <div class="bars">
      <div class="bar"><i id="barShield"></i></div>
      <div class="bar b2"><i id="barPower"></i></div>
      <div class="bar b3"><i id="barThreat"></i></div>
    </div>
    <div style="margin-top:10px"><span class="k">fps</span> <span class="v" id="uiFps">60</span>
      <span class="k" style="margin-left:14px">stars</span> <span class="v" id="uiStars">0</span></div>
  </div>

  <div class="panel p-br">
    <div><span class="k">weapons</span> <span class="v" id="uiWeapon">AUTO</span></div>
    <div><span class="k">audio</span> <span class="v" id="uiAudio">OFF</span></div>
    <div><span class="k">kills</span> <span class="v amber" id="uiKills">0</span></div>
  </div>
</div>

<div id="hint">
  <div>移 动 鼠 标 ／ 触 摸 拖 动 　·　<b>指 挥 舰 队</b></div>
  <div class="sub">点击 / 空格 = 超空间跃迁　　C = 自动巡航　　F = 开火　　M = 音效</div>
</div>

<div id="dock">
  <button id="btnWarp">超空间跃迁</button>
  <button id="btnCruise">自动巡航：开</button>
  <button id="btnFire">开火</button>
  <button id="btnAudio">音效：关</button>
  <button id="btnFull">全屏</button>
</div>

<script>
(() => {
  "use strict";

  /* ══════════════════════════════════════════════════════
     0. 基础工具
     ══════════════════════════════════════════════════════ */
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp  = (a, b, t) => a + (b - a) * t;
  const rand  = (a, b) => a + Math.random() * (b - a);
  const TAU   = Math.PI * 2;

  const cvs = document.getElementById("stage");
  const ctx = cvs.getContext("2d", { alpha: false });

  let W = 0, H = 0, DPR = 1, CX = 0, CY = 0, S = 1;

  /* ══════════════════════════════════════════════════════
     1. 全局状态
     ══════════════════════════════════════════════════════ */
  const state = {
    t: 0,
    dt: 1 / 60,
    dpr: 1,
    warp: 0,          // 0 → 1 超空间强度（缓动后）
    warpTarget: 0,
    warpCooldown: 0,
    cruise: true,
    autoFire: true,
    audio: false,
    autoQuality: 0,   // 0 高画质 → 3 低画质
    fpsEMA: 60,
    kills: 0,
    shield: 1,
    hull: 1,
    threat: 0,
    power: .72,
    weaponHeat: 0,
    weaponState: "AUTO",
    shake: 0,
    flash: 0,
    timeScale: 1
  };

  // 指针 / 视差
  const pointer = { x: .5, y: .5, tx: .5, ty: .5, down: false, seen: false };
  const camera  = { x: 0, y: 0, roll: 0, zoom: 1 };

  /* ══════════════════════════════════════════════════════
     2. 星空 / 星云 / 行星 / 残骸
     ══════════════════════════════════════════════════════ */
  const PALETTE = [
    [255, 255, 255], [186, 224, 255], [255, 236, 200],
    [255, 200, 200], [205, 255, 240], [225, 210, 255]
  ];

  /** 单颗星星（远景视差层） */
  function makeStar(layer) {
    const depth = layer / (STAR_LAYERS - 1);      // 0 远 → 1 近
    return {
      x: Math.random() * (W + 400) - 200,
      y: Math.random() * H,
      z: depth,
      r: lerp(.35, 2.05, depth * depth) * rand(.7, 1.4),
      base: lerp(.22, 1, depth) * rand(.5, 1),
      tw: Math.random() * TAU,                    // 闪烁相位
      tws: rand(1.4, 4.2),                        // 闪烁速度
      c: PALETTE[(Math.random() * PALETTE.length) | 0],
      px: 0, py: 0, trail: 0
    };
  }

  const STAR_LAYERS = 5;
  let stars = [];

  /** 星云（预渲染到离屏 canvas，运行时用加法混合慢速平移） */
  const nebulae = [];
  function makeNebula(scale, alpha, hue) {
    const size = Math.round(scale);
    const off = document.createElement("canvas");
    off.width = off.height = size;
    const o = off.getContext("2d");
    const puffs = 26;
    for (let i = 0; i < puffs; i++) {
      const r = size * rand(.08, .3);
      const x = size / 2 + rand(-1, 1) * size * .26;
      const y = size / 2 + rand(-1, 1) * size * .26;
      const g = o.createRadialGradient(x, y, 0, x, y, r);
      const a = alpha * rand(.16, .5);
      g.addColorStop(0, `hsla(${hue + rand(-26, 26)},${rand(72, 96)}%,${rand(52, 72)}%,${a})`);
      g.addColorStop(.45, `hsla(${hue + rand(-30, 30)},90%,45%,${a * .35})`);
      g.addColorStop(1, "hsla(230,90%,40%,0)");
      o.fillStyle = g;
      o.beginPath();
      o.arc(x, y, r, 0, TAU);
      o.fill();
    }
    // 内部星尘
    o.globalCompositeOperation = "lighter";
    for (let i = 0; i < size * 0.35; i++) {
      const x = Math.random() * size, y = Math.random() * size;
      const d = Math.hypot(x - size / 2, y - size / 2) / (size / 2);
      if (d > 1) continue;
      o.fillStyle = `rgba(255,255,255,${(1 - d) * .28})`;
      o.fillRect(x, y, 1, 1);
    }
    return off;
  }

  function buildNebulae() {
    nebulae.length = 0;
    const cfg = [
      { s: 760, a: .95, h: 268, sp: 5 },
      { s: 560, a: .80, h: 196, sp: 8 },
      { s: 420, a: .70, h: 320, sp: 12 },
      { s: 340, a: .55, h: 172, sp: 16 }
    ];
    for (const c of cfg) {
      nebulae.push({
        img: makeNebula(c.s, c.a, c.h),
        x: rand(0, W), y: rand(0, H),
        sp: c.sp, rot: rand(-.4, .4), spin: rand(-.02, .02), phase: Math.random() * TAU
      });
    }
  }

  /* ══════════════════════════════════════════════════════
     3. 粒子 / 弹丸 / 敌机 系统
     ══════════════════════════════════════════════════════ */
  const particles = [];
  const bolts = [];
  const enemies = [];
  const shockwaves = [];

  function spawnParticle(x, y, vx, vy, life, size, color, drag = .94, glow = 1) {
    if (particles.length > 1400) particles.shift();
    particles.push({ x, y, vx, vy, life, max: life, size, color, drag, glow });
  }

  function burst(x, y, n, hue, power = 1) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU;
      const sp = rand(30, 340) * power;
      spawnParticle(
        x, y,
        Math.cos(a) * sp, Math.sin(a) * sp,
        rand(.25, .9) * power, rand(1, 3.4) * power,
        `hsl(${hue + rand(-22, 22)},${rand(80, 100)}%,${rand(55, 80)}%)`,
        rand(.88, .96)
      );
    }
  }

  function makeEnemy() {
    const fromTop = Math.random() < .5;
    const size = rand(16, 46);
    return {
      x: W + rand(60, 460),
      y: fromTop ? rand(-40, H * .32) : rand(H * .68, H + 40),
      vx: -rand(120, 300) * (size < 26 ? 1.35 : 1),
      vy: rand(-26, 26),
      size,
      hp: size < 26 ? 1 : 2,
      hue: Math.random() < .5 ? rand(320, 360) : rand(0, 22),
      phase: Math.random() * TAU,
      hit: 0,
      ang: Math.PI
    };
  }

  function spawnWave(n) {
    for (let i = 0; i < n; i++) {
      const e = makeEnemy();
      e.x += i * rand(70, 180);
      enemies.push(e);
    }
  }

  /* ══════════════════════════════════════════════════════
     4. 战舰几何（局部坐标，原点在舰体中心）
     ══════════════════════════════════════════════════════ */
  const SHIP_LEN = 560;          // 设计基准长度
  let shipScale = 1;
  const turrets = [];

  function buildTurrets() {
    turrets.length = 0;
    const defs = [
      { x: -110, y: -22, s: 1.0 },
      { x: -110, y:  22, s: 1.0 },
      { x:   70, y: -30, s: .85 },
      { x:   70, y:  30, s: .85 },
      { x:  195, y:   0, s: .7 }
    ];
    for (const d of defs) {
      turrets.push({ x: d.x, y: d.y, s: d.s, ang: 0, cool: Math.random() * .5, recoil: 0 });
    }
  }

  function shipTransform(g) {
    // 把绘制坐标系搬到战舰所在位置
    g.translate(CX + camera.x, CY + camera.y);
    g.rotate(camera.roll);
    g.scale(shipScale, shipScale);
  }

  /** 用路径绘制舰体主体 */
  function hullPath(g) {
    g.beginPath();
    g.moveTo(250, 0);                                // 舰首
    g.lineTo(196, -20);
    g.lineTo(128, -34);
    g.lineTo(46, -52);
    g.lineTo(-84, -62);
    g.lineTo(-176, -86);                             // 发动机短舱上缘
    g.lineTo(-268, -78);
    g.lineTo(-300, -44);
    g.lineTo(-292, -20);
    g.lineTo(-208, -16);                             // 尾椎收窄
    g.lineTo(-206, 16);
    g.lineTo(-292, 20);
    g.lineTo(-300, 44);
    g.lineTo(-268, 78);
    g.lineTo(-176, 86);
    g.lineTo(-84, 62);
    g.lineTo(46, 52);
    g.lineTo(128, 34);
    g.lineTo(196, 20);
    g.closePath();
  }

  function drawShip(g) {
    const glow = 1 + state.warp * 1.6;
    const bob = Math.sin(state.t * .8) * 5 + Math.sin(state.t * 2.1) * 1.6;

    g.save();
    shipTransform(g);
    g.translate(0, bob);

    /* ---- 引擎辉光（先画，在舰体后面） ---- */
    g.save();
    g.globalCompositeOperation = "lighter";
    for (const ey of [-46, 0, 46]) {
      const flick = .78 + Math.sin(state.t * 26 + ey) * .1 + Math.random() * .12;
      const len = (120 + state.warp * 520) * flick;
      const grd = g.createLinearGradient(-300, 0, -300 - len, 0);
      grd.addColorStop(0, `rgba(255,255,255,${.95 * glow})`);
      grd.addColorStop(.12, `rgba(150,235,255,${.85 * glow})`);
      grd.addColorStop(.45, `rgba(80,150,255,${.35 * glow})`);
      grd.addColorStop(1, "rgba(40,80,220,0)");
      g.fillStyle = grd;
      const halfH = (ey === 0 ? 20 : 26) * (1 + state.warp * .5);
      g.beginPath();
      g.moveTo(-290, ey - halfH);
      g.lineTo(-290 - len, ey);
      g.lineTo(-290, ey + halfH);
      g.closePath();
      g.fill();
    }
    g.restore();

    /* ---- 舰体 ---- */
    const hullGrad = g.createLinearGradient(0, -90, 0, 90);
    hullGrad.addColorStop(0, "#4d5f74");
    hullGrad.addColorStop(.22, "#2e3b4d");
    hullGrad.addColorStop(.5, "#1b2431");
    hullGrad.addColorStop(.78, "#28323f");
    hullGrad.addColorStop(1, "#141b25");
    hullPath(g);
    g.fillStyle = hullGrad;
    g.fill();

    // 舰体轮廓灯
    g.strokeStyle = "rgba(140,225,255,.55)";
    g.lineWidth = 1.6;
    g.stroke();

    // 高光条
    g.save();
    hullPath(g);
    g.clip();
    g.globalCompositeOperation = "lighter";
    const sheen = g.createLinearGradient(0, -90, 0, 0);
    sheen.addColorStop(0, "rgba(190,235,255,.16)");
    sheen.addColorStop(1, "rgba(190,235,255,0)");
    g.fillStyle = sheen;
    g.fillRect(-320, -92, 600, 92);

    // 甲板结构线
    g.strokeStyle = "rgba(120,180,215,.20)";
    g.lineWidth = 1;
    for (let i = 0; i < 26; i++) {
      const x = -280 + i * 22;
      const yTop = -Math.abs(86 - Math.abs(x + 40) * .18);
      g.beginPath();
      g.moveTo(x, yTop * .9);
      g.lineTo(x, -yTop * .9);
      g.stroke();
    }
    // 中央脊线
    g.strokeStyle = "rgba(150,215,248,.30)";
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(240, 0);
    g.lineTo(-286, 0);
    g.stroke();

    // 舷侧窗灯
    g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 54; i++) {
      const x = -260 + (i % 27) * 18;
      const side = i < 27 ? -1 : 1;
      const tw = .45 + .55 * Math.abs(Math.sin(state.t * 2 + i * 1.7));
      g.fillStyle = `rgba(255,214,150,${.55 * tw})`;
      g.fillRect(x, side * (44 + Math.sin(i) * 6) - 1, 5, 2);
    }

    // 舰桥 / 指挥塔
    g.globalCompositeOperation = "source-over";
    const bridgeGrad = g.createLinearGradient(0, -34, 0, 20);
    bridgeGrad.addColorStop(0, "#66798f");
    bridgeGrad.addColorStop(1, "#1a2230");
    g.fillStyle = bridgeGrad;
    g.beginPath();
    g.moveTo(126, -6);
    g.lineTo(96, -30);
    g.lineTo(20, -30);
    g.lineTo(-2, -8);
    g.lineTo(-2, 8);
    g.lineTo(20, 30);
    g.lineTo(96, 30);
    g.lineTo(126, 6);
    g.closePath();
    g.fill();
    g.strokeStyle = "rgba(150,230,255,.45)";
    g.lineWidth = 1.4;
    g.stroke();

    // 舰桥窗户
    g.globalCompositeOperation = "lighter";
    g.fillStyle = "rgba(180,245,255,.85)";
    g.fillRect(24, -22, 74, 7);
    g.fillRect(24, 15, 74, 7);
    g.fillStyle = "rgba(255,180,120,.9)";
    g.fillRect(24, -6, 62, 3);
    g.fillRect(24, 3, 62, 3);

    // 装甲分块斜纹
    g.globalCompositeOperation = "source-over";
    g.strokeStyle = "rgba(10,16,24,.6)";
    g.lineWidth = 2;
    for (let i = 0; i < 9; i++) {
      const x = -220 + i * 46;
      g.beginPath();
      g.moveTo(x, -70);
      g.lineTo(x - 34, 70);
      g.stroke();
    }
    g.restore();

    /* ---- 舰首能量尖刺 ---- */
    g.save();
    g.globalCompositeOperation = "lighter";
    const noseGlow = .5 + state.warp * .5 + Math.sin(state.t * 5) * .08;
    const ng = g.createLinearGradient(250, 0, 330, 0);
    ng.addColorStop(0, `rgba(180,240,255,${noseGlow})`);
    ng.addColorStop(1, "rgba(120,200,255,0)");
    g.fillStyle = ng;
    g.beginPath();
    g.moveTo(248, -9);
    g.lineTo(340, 0);
    g.lineTo(248, 9);
    g.closePath();
    g.fill();
    g.restore();

    /* ---- 炮塔 ---- */
    for (const t of turrets) drawTurret(g, t);

    /* ---- 护盾弧光 ---- */
    if (state.shield > .02) {
      g.save();
      g.globalCompositeOperation = "lighter";
      const a = state.shield * (.16 + state.warp * .10 + state.threat * .16);
      for (let k = 0; k < 2; k++) {
        const rr = 320 + k * 46 + Math.sin(state.t * 1.6 + k) * 8;
        g.strokeStyle = `rgba(${120 + k * 40},${225 - k * 20},255,${a * (1 - k * .35)})`;
        g.lineWidth = 2.4 - k;
        g.beginPath();
        g.ellipse(-20, 0, rr, rr * .52, 0, 0, TAU);
        g.stroke();
      }
      // 受击六边形网格
      if (state.threat > .12) {
        g.strokeStyle = `rgba(150,235,255,${state.threat * .28})`;
        g.lineWidth = 1;
        for (let i = 0; i < 14; i++) {
          const a1 = (i / 14) * TAU + state.t * .1;
          const r1 = 330, r2 = 372;
          g.beginPath();
          g.moveTo(Math.cos(a1) * r1 * 1.0 - 20, Math.sin(a1) * r1 * .52);
          g.lineTo(Math.cos(a1 + .3) * r2 - 20, Math.sin(a1 + .3) * r2 * .52);
          g.stroke();
        }
      }
      g.restore();
    }
    g.restore();
  }

  function drawTurret(g, t) {
    g.save();
    g.translate(t.x, t.y);
    g.scale(t.s, t.s);
    // 底座
    g.fillStyle = "#232c39";
    g.beginPath();
    g.arc(0, 0, 20, 0, TAU);
    g.fill();
    g.strokeStyle = "rgba(150,220,255,.4)";
    g.lineWidth = 1.4;
    g.stroke();

    g.save();
    g.rotate(t.ang);
    g.translate(-t.recoil * 6, 0);
    // 炮管
    g.fillStyle = "#3a475a";
    g.fillRect(6, -9, 40, 5);
    g.fillRect(6, 4, 40, 5);
    g.strokeStyle = "rgba(140,215,255,.35)";
    g.lineWidth = 1;
    g.strokeRect(6, -9, 40, 5);
    g.strokeRect(6, 4, 40, 5);
    // 炮塔罩
    g.fillStyle = "#2b3646";
    g.beginPath();
    g.arc(0, 0, 13, 0, TAU);
    g.fill();
    g.fillStyle = "#465468";
    g.beginPath();
    g.arc(-2, 0, 7, 0, TAU);
    g.fill();
    // 炮口热量
    const heat = clamp(t.recoil, 0, 1);
    if (heat > .02) {
      g.globalCompositeOperation = "lighter";
      g.fillStyle = `rgba(255,${180 - heat * 80},90,${heat * .9})`;
      g.beginPath();
      g.arc(46, -6.5, 3 + heat * 5, 0, TAU);
      g.arc(46, 6.5, 3 + heat * 5, 0, TAU);
      g.fill();
    }
    g.restore();
    g.restore();
  }

  /* ══════════════════════════════════════════════════════
     5. 音效（WebAudio 合成，无外部资源）
     ══════════════════════════════════════════════════════ */
  const audio = {
    ctx: null, master: null, humGain: null, on: false,
    init() {
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ac = new AC();
      this.ctx = ac;
      const master = ac.createGain();
      master.gain.value = .26;
      master.connect(ac.destination);
      this.master = master;

      // 引擎低鸣：两个失谐锯齿波 + 低通
      const hum = ac.createGain();
      hum.gain.value = 0;
      const lp = ac.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 240;
      hum.connect(lp); lp.connect(master);
      this.humFilter = lp;
      for (const f of [42, 63.5, 84.8]) {
        const o = ac.createOscillator();
        o.type = "sawtooth";
        o.frequency.value = f;
        const g = ac.createGain();
        g.gain.value = .22;
        o.connect(g); g.connect(hum);
        o.start();
      }
      this.humGain = hum;

      // 噪声源（爆炸 / 激光）
      const len = ac.sampleRate * 2;
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
    },
    setOn(v) {
      this.on = v;
      state.audio = v;
      if (v && !this.ctx) this.init();
      if (this.ctx) {
        if (this.ctx.state === "suspended") this.ctx.resume();
        this.humGain.gain.setTargetAtTime(v ? .5 : 0, this.ctx.currentTime, .35);
      }
    },
    laser() {
      if (!this.on || !this.ctx) return;
      const ac = this.ctx, t = ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
      o.type = "square";
      o.frequency.setValueAtTime(1400, t);
      o.frequency.exponentialRampToValueAtTime(180, t + .16);
      f.type = "bandpass"; f.frequency.value = 900; f.Q.value = 1.2;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.25, t + .008);
      g.gain.exponentialRampToValueAtTime(.0001, t + .18);
      o.connect(f); f.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + .2);
    },
    boom(power = 1) {
      if (!this.on || !this.ctx) return;
      const ac = this.ctx, t = ac.currentTime;
      const src = ac.createBufferSource();
      src.buffer = this.noise;
      src.playbackRate.value = .8;
      const f = ac.createBiquadFilter();
      f.type = "lowpass";
      f.frequency.setValueAtTime(1200 * power, t);
      f.frequency.exponentialRampToValueAtTime(90, t + .55);
      const g = ac.createGain();
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.5 * power, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + .7);
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(t); src.stop(t + .75);
    },
    warp() {
      if (!this.on || !this.ctx) return;
      const ac = this.ctx, t = ac.currentTime;
      const src = ac.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const f = ac.createBiquadFilter();
      f.type = "bandpass"; f.Q.value = 6;
      f.frequency.setValueAtTime(160, t);
      f.frequency.exponentialRampToValueAtTime(4200, t + .5);
      f.frequency.exponentialRampToValueAtTime(300, t + 1.4);
      const g = ac.createGain();
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.45, t + .35);
      g.gain.exponentialRampToValueAtTime(.0001, t + 1.5);
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(t); src.stop(t + 1.6);
    }
  };

  /* ══════════════════════════════════════════════════════
     6. 输入
     ══════════════════════════════════════════════════════ */
  function setPointer(cx, cy) {
    pointer.tx = clamp(cx / W, 0, 1);
    pointer.ty = clamp(cy / H, 0, 1);
    pointer.seen = true;
    hideHint();
  }

  window.addEventListener("pointermove", e => setPointer(e.clientX, e.clientY));
  window.addEventListener("pointerdown", e => {
    if (e.target.closest("#dock")) return;
    setPointer(e.clientX, e.clientY);
    triggerWarp();
  });
  window.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k === " " || e.code === "Space") { e.preventDefault(); triggerWarp(); }
    else if (k === "c") toggleCruise();
    else if (k === "f") fireVolley(true);
    else if (k === "m") toggleAudio();
  });

  /* ══════════════════════════════════════════════════════
     7. 动作
     ══════════════════════════════════════════════════════ */
  let hintHidden = false;
  function hideHint(force = false) {
    if (hintHidden) return;
    if (!force && !pointer.seen) return;
    hintHidden = true;
    const el = document.getElementById("hint");
    if (!el) return;
    el.style.opacity = "0";
    setTimeout(() => el.remove(), 900);
  }

  function triggerWarp() {
    if (state.warpCooldown > 0) return;
    state.warpTarget = 1;
    state.warpCooldown = 3.2;
    state.flash = .9;
    state.shake = 12;
    shockwaves.push({ x: CX, y: CY, r: 0, max: Math.max(W, H) * .95, life: 1, hue: 190 });
    burst(CX - 40, CY, 90, 200, 1.5);
    audio.warp();
  }

  function toggleCruise() {
    state.cruise = !state.cruise;
    document.getElementById("btnCruise").textContent = "自动巡航：" + (state.cruise ? "开" : "关");
  }

  function toggleAudio() {
    audio.setOn(!audio.on);
    const b = document.getElementById("btnAudio");
    b.textContent = "音效：" + (audio.on ? "开" : "关");
    b.classList.toggle("on", audio.on);
    document.getElementById("uiAudio").textContent = audio.on ? "ON" : "OFF";
  }

  function fireVolley(manual = false) {
    if (state.weaponHeat > .96 && !manual) return;
    state.weaponHeat = clamp(state.weaponHeat + .18, 0, 1);
    state.weaponState = "FIRING";
    let fired = 0;
    for (const t of turrets) {
      if (t.cool > 0) continue;
      const wx = CX + Math.cos(camera.roll) * t.x * shipScale - Math.sin(camera.roll) * t.y * shipScale;
      const wy = CY + Math.sin(camera.roll) * t.x * shipScale + Math.cos(camera.roll) * t.y * shipScale;
      const ang = camera.roll + t.ang;
      const mx = wx + Math.cos(ang) * 46 * t.s * shipScale;
      const my = wy + Math.sin(ang) * 46 * t.s * shipScale;
      bolts.push({
        x: mx, y: my,
        vx: Math.cos(ang) * 1500, vy: Math.sin(ang) * 1500,
        life: 1.1, hue: 190, len: 46, dmg: 1
      });
      spawnParticle(mx, my, Math.cos(ang) * 60, Math.sin(ang) * 60, .22, 7, "rgba(200,245,255,.9)", .85);
      t.cool = .34 + t.s * .16;
      t.recoil = 1;
      fired++;
    }
    if (fired) { state.shake = Math.max(state.shake, 3.2); audio.laser(); }
  }

  /* ══════════════════════════════════════════════════════
     8. 初始化 / 尺寸
     ══════════════════════════════════════════════════════ */
  function resize() {
    DPR = clamp(window.devicePixelRatio || 1, 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width = Math.floor(W * DPR);
    cvs.height = Math.floor(H * DPR);
    cvs.style.width = W + "px";
    cvs.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W * .5;
    CY = H * .52;
    S = Math.min(W / 1600, H / 900);
    shipScale = clamp(S * 1.05, .34, 1.5);

    // 星空重建（保持层次感与密度）
    const target = clamp(Math.round(W * H / 2100), 700, 4200);
    stars = new Array(target);
    for (let i = 0; i < target; i++) {
      stars[i] = makeStar(i % STAR_LAYERS);
      stars[i].x = Math.random() * (W + 400) - 200;
    }
    buildNebulae();
    initDust();
    document.getElementById("uiStars").textContent = target;
  }

  let resizeTimer = 0;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 220);
  }
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);

  /* ══════════════════════════════════════════════════════
     9. 更新
     ══════════════════════════════════════════════════════ */
  function update(dt) {
    state.t += dt;
    state.dt = dt;

    /* --- 指针平滑 & 摄像机 --- */
    pointer.x = lerp(pointer.x, pointer.tx, 1 - Math.pow(.001, dt));
    pointer.y = lerp(pointer.y, pointer.ty, 1 - Math.pow(.001, dt));
    const px = (pointer.x - .5), py = (pointer.y - .5);
    camera.x = lerp(camera.x, -px * 46, 1 - Math.pow(.02, dt));
    camera.y = lerp(camera.y, -py * 30, 1 - Math.pow(.02, dt));
    camera.roll = lerp(camera.roll, -px * .085 + Math.sin(state.t * .35) * .012, 1 - Math.pow(.05, dt));

    /* --- 超空间状态机 --- */
    state.warpCooldown = Math.max(0, state.warpCooldown - dt);
    if (state.warpTarget > 0) {
      state.warp = Math.min(1, state.warp + dt * 1.35);
      if (state.warp >= 1) state.warpTarget = 0;
    } else {
      state.warp = Math.max(0, state.warp - dt * .62);
    }
    state.warpCooldown = Math.max(0, state.warpCooldown);
    if (state.warpTarget === 0 && state.warp > .02 && Math.random() < .1) {
      spawnParticle(CX + rand(-W * .4, W * .4), CY + rand(-H * .4, H * .4),
        -rand(600, 2200), 0, .4, rand(1, 2.6), "rgba(190,240,255,.8)", .99);
    }

    /* --- 闪烁 / 震动 / 泛光衰减 --- */
    state.shake = Math.max(0, state.shake - dt * 26);
    state.flash = Math.max(0, state.flash - dt * 1.9);
    state.threat = lerp(state.threat, clamp(enemies.length / 6, 0, 1), 1 - Math.pow(.1, dt));
    state.power = lerp(state.power, .55 + state.warp * .42 + Math.sin(state.t * .9) * .03, 1 - Math.pow(.2, dt));
    state.weaponHeat = Math.max(0, state.weaponHeat - dt * .45);

    /* --- 星空 --- */
    const baseSpeed = 26 + state.warp * 2400;
    for (const s of stars) {
      const sp = baseSpeed * (.25 + s.z * 1.9) * (state.cruise ? 1 : .28);
      s.px = s.x;
      s.x -= sp * dt;
      s.y += (sp * .06) * dt * (s.z - .4);
      if (s.x < -240) { s.x = W + 200; s.y = Math.random() * H; }
      if (s.y < -60) s.y = H + 40;
      if (s.y > H + 60) s.y = -40;
      s.tw += s.tws * dt;
      s.trail = lerp(s.trail, state.warp, 1 - Math.pow(.001, dt));
    }

    /* --- 星云 --- */
    for (const n of nebulae) {
      n.x -= (8 + state.warp * 700) * n.sp * .16 * dt;
      n.y += Math.sin(state.t * .18 + n.phase) * 3 * dt;
      n.rot += n.spin * dt;
      if (n.x < -n.img.width) { n.x = W + n.img.width * .3; n.y = rand(0, H); }
    }

    /* --- 炮塔瞄准 & 自动开火 --- */
    let target = null, bestD = Infinity;
    for (const e of enemies) {
      if (e.x < CX) continue;
      const d = e.x - CX;
      if (d < bestD) { bestD = d; target = e; }
    }
    for (const t of turrets) {
      t.cool = Math.max(0, t.cool - dt);
      t.recoil = Math.max(0, t.recoil - dt * 4.5);
      if (target) {
        const wx = t.x * shipScale, wy = t.y * shipScale;
        const tx = target.x - CX, ty = target.y - CY;
        const want = Math.atan2(ty - wy, tx - wx) - camera.roll;
        let d = ((want - t.ang + Math.PI) % TAU + TAU) % TAU - Math.PI;
        t.ang += d * Math.min(1, dt * 6);
      } else {
        t.ang = lerp(t.ang, 0, dt * 2);
      }
    }
    if (state.autoFire && target && state.cruise && state.warp < .5) {
      if (Math.random() < dt * (2.4 + enemies.length * .35)) fireVolley();
    }
    if (state.weaponState === "FIRING" && state.weaponHeat < .05) state.weaponState = "AUTO";

    /* --- 敌机 --- */
    if (state.cruise && enemies.length < 7 && Math.random() < dt * (state.warp > .5 ? .2 : .8)) {
      spawnWave(Math.random() < .3 ? 2 : 1);
    }
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.x += e.vx * dt * (1 + state.warp * 2);
      e.vy += Math.sin(state.t * 2 + e.phase) * 24 * dt;
      e.y += e.vy * dt;
      e.hit = Math.max(0, e.hit - dt * 3);
      if (e.x < -160 || e.y < -220 || e.y > H + 220) { enemies.splice(i, 1); continue; }
    }

    /* --- 弹丸 --- */
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (b.life <= 0 || b.x > W + 80 || b.x < -80 || b.y < -80 || b.y > H + 80) {
        bolts.splice(i, 1); continue;
      }
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (Math.hypot(e.x - b.x, e.y - b.y) < e.size * .8 + 6) {
          e.hp -= b.dmg;
          e.hit = 1;
          burst(b.x, b.y, 8, e.hue, .45);
          bolts.splice(i, 1);
          if (e.hp <= 0) {
            enemies.splice(j, 1);
            state.kills++;
            state.shake = Math.max(state.shake, 5);
            burst(e.x, e.y, 34, e.hue, e.size / 22);
            burst(e.x, e.y, 10, 40, e.size / 26);
            shockwaves.push({ x: e.x, y: e.y, r: 0, max: e.size * 7, life: 1, hue: e.hue });
            audio.boom(clamp(e.size / 30, .45, 1.2));
          }
          break;
        }
      }
    }

    /* --- 粒子 --- */
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const dr = Math.pow(p.drag, dt * 60);
      p.vx *= dr; p.vy *= dr;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    /* --- 冲击波 --- */
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const s = shockwaves[i];
      s.r += (s.max - s.r) * Math.min(1, dt * 3.2);
      s.life -= dt * 1.1;
      if (s.life <= 0) shockwaves.splice(i, 1);
    }

    /* --- HUD 数值 --- */
    state.shield = clamp(state.shield - (state.threat > .7 && Math.random() < dt * .35 ? .006 : 0) + (state.threat < .2 ? dt * .01 : 0), .18, 1);
    state.hull = clamp(1 - state.kills * 0 - (1 - state.shield) * .35, .3, 1);
  }

  /* ══════════════════════════════════════════════════════
     10. 渲染
     ══════════════════════════════════════════════════════ */
  function drawBackground() {
    // 深空底色 + 轻微星云氛围
    const g = ctx.createLinearGradient(0, 0, W * .35, H);
    g.addColorStop(0, "#04060f");
    g.addColorStop(.45, "#070a1a");
    g.addColorStop(1, "#02030a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const n of nebulae) {
      ctx.save();
      ctx.translate(n.x + camera.x * .35, n.y + camera.y * .35);
      ctx.rotate(n.rot);
      ctx.globalAlpha = .5 + state.warp * .12;
      ctx.drawImage(n.img, -n.img.width / 2, -n.img.height / 2);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawStars() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const skipFar = state.autoQuality > 1.5;   // 低画质时跳过最远一层星空
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      if (skipFar && s.z < .34) continue;
      const tw = .55 + .45 * Math.sin(s.tw);
      const a = s.base * tw * (1 + state.warp * .3);
      const x = s.x + camera.x * (.2 + s.z * .8);
      const y = s.y + camera.y * (.2 + s.z * .8);
      const streak = s.trail * (240 + s.z * 900) * (state.cruise ? 1 : .3);
      const [r, gg, b] = s.c;
      if (streak > 6) {
        // 超空间拖尾：用加法混合模拟渐隐，避免每帧为每颗星创建渐变对象
        ctx.strokeStyle = `rgba(${r},${gg},${b},${clamp(a * .75, 0, 1)})`;
        ctx.lineWidth = s.r * (1 + s.trail * 1.2);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + streak, y);
        ctx.stroke();
      } else {
        ctx.fillStyle = `rgba(${r},${gg},${b},${clamp(a, 0, 1)})`;
        ctx.beginPath();
        ctx.arc(x, y, s.r, 0, TAU);
        ctx.fill();
        // 亮星十字光芒
        if (s.z > .72 && s.r > 1.2) {
          ctx.globalAlpha = a * .5;
          ctx.fillRect(x - s.r * 4, y - .5, s.r * 8, 1);
          ctx.fillRect(x - .5, y - s.r * 4, 1, s.r * 8);
          ctx.globalAlpha = 1;
        }
      }
    }
    ctx.restore();
  }

  function drawEnemies() {
    for (const e of enemies) {
      ctx.save();
      ctx.translate(e.x, e.y);
      const tilt = Math.sin(state.t * 3 + e.phase) * .18;
      ctx.rotate(tilt);
      const hue = e.hue;
      const body = e.hit > 0 ? `hsl(${hue},100%,${70 + e.hit * 20}%)` : `hsl(${hue},62%,20%)`;
      const edge = `hsl(${hue},95%,62%)`;

      // 引擎尾焰（朝右，敌机向左飞）
      ctx.globalCompositeOperation = "lighter";
      const fl = e.size * (1.6 + Math.random() * .5);
      const fg = ctx.createLinearGradient(e.size * .5, 0, e.size * .5 + fl, 0);
      fg.addColorStop(0, `hsla(${hue},100%,80%,.75)`);
      fg.addColorStop(1, `hsla(${hue},100%,60%,0)`);
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(e.size * .5, -e.size * .18);
      ctx.lineTo(e.size * .5 + fl, 0);
      ctx.lineTo(e.size * .5, e.size * .18);
      ctx.closePath();
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";

      // 机体（菱形战机）
      ctx.beginPath();
      ctx.moveTo(-e.size, 0);
      ctx.lineTo(-e.size * .2, -e.size * .42);
      ctx.lineTo(e.size * .55, -e.size * .28);
      ctx.lineTo(e.size * .62, 0);
      ctx.lineTo(e.size * .55, e.size * .28);
      ctx.lineTo(-e.size * .2, e.size * .42);
      ctx.closePath();
      ctx.fillStyle = body;
      ctx.fill();
      ctx.strokeStyle = e.hit > 0 ? "#fff" : edge;
      ctx.lineWidth = 1.6;
      ctx.stroke();

      // 驾驶舱光点
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = `hsla(${hue},100%,75%,.85)`;
      ctx.beginPath();
      ctx.arc(-e.size * .45, 0, e.size * .1, 0, TAU);
      ctx.fill();
      // 血条
      if (e.hp > 1) {
        ctx.fillStyle = "rgba(255,90,120,.85)";
        ctx.fillRect(-e.size * .5, -e.size - 7, e.size, 2.5);
      }
      ctx.restore();
    }
  }

  function drawBolts() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const b of bolts) {
      const n = Math.hypot(b.vx, b.vy) || 1;
      const ux = b.vx / n, uy = b.vy / n;
      const tx = b.x - ux * b.len, ty = b.y - uy * b.len;
      const g = ctx.createLinearGradient(tx, ty, b.x, b.y);
      g.addColorStop(0, "rgba(120,200,255,0)");
      g.addColorStop(.55, "rgba(150,235,255,.55)");
      g.addColorStop(1, "rgba(255,255,255,1)");
      ctx.strokeStyle = g;
      ctx.lineWidth = 4.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      // 弹头辉光
      const rg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 16);
      rg.addColorStop(0, "rgba(220,250,255,.9)");
      rg.addColorStop(1, "rgba(120,200,255,0)");
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(b.x, b.y, 16, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawParticles() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const p of particles) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a * a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (.4 + a * .8), 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawShockwaves() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const s of shockwaves) {
      const a = clamp(s.life, 0, 1);
      ctx.strokeStyle = `hsla(${s.hue},100%,78%,${a * .6})`;
      ctx.lineWidth = 1 + a * 4;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = `hsla(${s.hue + 40},100%,88%,${a * .3})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * .72, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawWarpTunnel() {
    if (state.warp < .02) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const n = 46;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + state.t * .35;
      const r0 = 90 + (i % 7) * 26;
      const r1 = r0 + 260 + state.warp * 900;
      const grd = ctx.createLinearGradient(
        CX + Math.cos(a) * r0, CY + Math.sin(a) * r0 * .6,
        CX + Math.cos(a) * r1, CY + Math.sin(a) * r1 * .6
      );
      grd.addColorStop(0, `rgba(160,225,255,${.30 * state.warp})`);
      grd.addColorStop(1, "rgba(90,150,255,0)");
      ctx.strokeStyle = grd;
      ctx.lineWidth = 2 + state.warp * 3;
      ctx.beginPath();
      ctx.moveTo(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0 * .6);
      ctx.lineTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1 * .6);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawLensFlare() {
    // 跃迁瞬间的全屏泛光
    if (state.flash < .01 && state.warp < .05) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const a = Math.max(state.flash * .5, state.warp * .12);
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * .8);
    g.addColorStop(0, `rgba(190,240,255,${a})`);
    g.addColorStop(.35, `rgba(120,180,255,${a * .35})`);
    g.addColorStop(1, "rgba(40,60,160,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  const DUST = [];
  function initDust() {
    DUST.length = 0;
    for (let i = 0; i < 26; i++) {
      DUST.push({
        y: Math.random() * H,
        len: rand(.5, 1.6),
        speed: rand(.6, 1.5),
        width: rand(.6, 1.6),
        phase: Math.random()
      });
    }
  }

  function drawForegroundDust() {
    // 近景尘埃，强化速度感（无渐变对象，保持高性能）
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    const travel = W + 900;
    for (let i = 0; i < DUST.length; i++) {
      const d = DUST[i];
      const x = W + 300 - ((state.t * (420 * d.speed) * (1 + state.warp * 5) + d.phase * travel) % travel);
      const len = (26 + d.len * 90) * (1 + state.warp * 6);
      ctx.strokeStyle = `rgba(195,232,255,${.13 + state.warp * .30})`;
      ctx.lineWidth = d.width + state.warp;
      ctx.beginPath();
      ctx.moveTo(x, d.y);
      ctx.lineTo(x + len, d.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ══════════════════════════════════════════════════════
     11. HUD 同步
     ══════════════════════════════════════════════════════ */
  const dom = {
    warp: document.getElementById("uiWarp"),
    shield: document.getElementById("uiShield"),
    hull: document.getElementById("uiHull"),
    hostile: document.getElementById("uiHostile"),
    fps: document.getElementById("uiFps"),
    kills: document.getElementById("uiKills"),
    weapon: document.getElementById("uiWeapon"),
    sector: document.getElementById("uiSector"),
    barShield: document.getElementById("barShield"),
    barPower: document.getElementById("barPower"),
    barThreat: document.getElementById("barThreat")
  };
  let hudAcc = 0;
  function syncHUD(dt) {
    hudAcc += dt;
    if (hudAcc < .1) return;
    hudAcc = 0;
    const w = 1 + state.warp * 26;
    dom.warp.textContent = w.toFixed(1) + "c";
    dom.shield.textContent = Math.round(state.shield * 100) + "%";
    dom.hull.textContent = Math.round(state.hull * 100) + "%";
    dom.hostile.textContent = String(enemies.length);
    dom.kills.textContent = String(state.kills);
    dom.weapon.textContent = state.weaponState;
    dom.fps.textContent = String(Math.round(state.fpsEMA));
    dom.barShield.style.transform = `scaleX(${state.shield})`;
    dom.barPower.style.transform = `scaleX(${clamp(state.power, 0, 1)})`;
    dom.barThreat.style.transform = `scaleX(${clamp(state.threat, 0, 1)})`;
    dom.sector.textContent = state.warp > .5
      ? "超空间通道 · 跃迁中"
      : `NGC-${4400 + (state.kills * 7) % 90} · 猎户臂`;
  }

  /* ══════════════════════════════════════════════════════
     12. 主循环
     ══════════════════════════════════════════════════════ */
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    dt = clamp(dt, 0, 1 / 20);               // 防跳帧
    const inst = 1 / Math.max(dt, 1e-4);
    state.fpsEMA = lerp(state.fpsEMA, inst, .06);

    // 自动降级：长时间低帧则减少粒子与尘埃
    if (state.fpsEMA < 42) state.autoQuality = Math.min(3, state.autoQuality + .01);
    else state.autoQuality = Math.max(0, state.autoQuality - .004);

    update(dt);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const sh = state.shake;
    if (sh > .05) {
      ctx.translate(rand(-sh, sh), rand(-sh, sh));
    }

    drawBackground();
    drawStars();
    if (state.autoQuality < 2.5) drawForegroundDust();
    drawWarpTunnel();
    drawShockwaves();
    drawEnemies();
    drawShip(ctx);
    drawBolts();
    drawParticles();
    drawLensFlare();

    hideHint();                     // 首次交互或超时后淡出提示
    syncHUD(dt);
    requestAnimationFrame(frame);
  }

  /* ══════════════════════════════════════════════════════
     13. 按钮绑定 & 启动
     ══════════════════════════════════════════════════════ */
  document.getElementById("btnWarp").addEventListener("click", triggerWarp);
  document.getElementById("btnCruise").addEventListener("click", toggleCruise);
  document.getElementById("btnFire").addEventListener("click", () => fireVolley(true));
  document.getElementById("btnAudio").addEventListener("click", toggleAudio);
  document.getElementById("btnFull").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  });

  resize();
  buildTurrets();
  // 开场：跃迁 + 一波敌机，让画面一开始就有内容
  setTimeout(() => { triggerWarp(); }, 700);
  setTimeout(() => { spawnWave(3); }, 2600);
  setTimeout(() => { hideHint(true); }, 11000);   // 无操作也会自动淡出
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
